<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" role="img" aria-labelledby="title desc">
  <title id="title">微信云开发个人版月成本估算热力图</title>
  <desc id="desc">上海地域，按平均存储量和月内容浏览次数展示月成本估算。假设每次浏览传输2MB图片资源并产生20次小程序API调用。</desc>
  <rect width="1240" height="930" fill="#fbfaf4"/>
  <text x="64" y="54" fill="#1f513e" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="29" font-weight="700">微信云开发 ¥19.9 个人版：月成本估算（上海地域）</text>
  <text x="64" y="84" fill="#66786d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16">假设：每次内容浏览加载 2 MB 图片资源，触发 20 次小程序 API 调用；x 为整月平均存储量，y 为月内容浏览次数。</text>
  <text x="64" y="111" fill="#66786d" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="14">单元格为预计月支付额（元），包含 ¥19.9 套餐费；绿色表示仍完全由套餐内 40,000 资源点覆盖。</text>
  <text x="80" y="166" fill="#365b47" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700">x：平均存储量</text>
  <text x="316" y="128" fill="#365b47" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="17" font-weight="700">y：月内容浏览次数</text>
